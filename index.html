<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hyakkiyako Club</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>


    <!-- =====================================================
         MENU SCREEN
    ====================================================== -->

    <section
        id="menuScreen"
        class="screen menu-screen"
    >

        <canvas
            id="particleCanvas"
        ></canvas>


        <!-- LOGO -->

        <div
            id="logoContainer"
            class="logo-container"
        >

            <img
                src="./hyakkiyako.png"
                alt="Hyakkiyako"
                class="main-logo"
            >

        </div>


        <!-- VIEW BUTTON -->

        <button
            id="viewButton"
            class="view-button"
        >

            <span>VIEW</span>

            <div class="button-line"></div>

        </button>

    </section>



    <!-- =====================================================
         LEADERBOARD SCREEN
    ====================================================== -->

    <section
        id="leaderboardScreen"
        class="screen leaderboard-screen"
    >

        <div
            class="leaderboard-container"
        >


            <!-- HEADER -->

            <div
                class="leaderboard-header"
            >

                <div
                    class="leaderboard-title"
                >

                    HYAKKIYAKO CLUB

                </div>


                <div
                    class="leaderboard-subtitle"
                >

                    5TH CLUB LEADERBOARD

                </div>

            </div>



            <!-- =================================================
                 BIG PLACEHOLDER
            ================================================== -->

            <div
                class="leaderboard-placeholder"
            >


                <!-- Corner decorations -->

                <div
                    class="corner corner-tl"
                ></div>

                <div
                    class="corner corner-tr"
                ></div>

                <div
                    class="corner corner-bl"
                ></div>

                <div
                    class="corner corner-br"
                ></div>



                <!-- Placeholder content -->

                <div
                    class="placeholder-label"
                >

                    CLUB RANKING

                </div>


                <div
                    class="placeholder-main"
                >

                    LEADERBOARD

                </div>


                <div
                    class="placeholder-line"
                ></div>


                <!-- WIP -->

                <div
                    class="placeholder-wip"
                >

                    WIP

                </div>


                <div
                    class="placeholder-description"
                >

                    MEMBER RANKING WILL APPEAR HERE

                </div>


            </div>



            <!-- =================================================
                 IZUNA PET GAME
            ================================================== -->

            <div
                id="izunaGame"
                class="izuna-game"
            >


                <!-- SCORE -->

                <div
                    class="pet-score"
                >

                    You have pet Izuna for

                    <span
                        id="petSeconds"
                    >
                        0.0
                    </span>

                    second

                </div>



                <!-- IZUNA -->

                <div
                    id="izunaArea"
                    class="izuna-area"
                >

                    <img
                        id="izunaStatic"
                        class="izuna-image"
                        src="./izuna-static.png"
                        alt="Izuna"
                        draggable="false"
                    >


                    <img
                        id="izunaPet"
                        class="izuna-image izuna-pet"
                        src="./izuna-pet.png"
                        alt="Izuna"
                        draggable="false"
                    >


                    <div
                        class="pet-glow"
                    ></div>

                </div>



                <!-- INSTRUCTION -->

                <div
                    id="petInstruction"
                    class="pet-instruction"
                >

                    RUB IZUNA'S HEAD

                </div>

            </div>

        </div>



        <!-- BACK -->

        <button
            id="backButton"
            class="back-button"
        >

            BACK

        </button>

    </section>



    <script src="./script.js"></script>

</body>

</html>
