<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Hyakkiyako Club</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>


    <!-- ================================================
         PARTICLE CANVAS
    ================================================= -->

    <canvas id="particleCanvas"></canvas>



    <!-- ================================================
         MENU SCREEN
    ================================================= -->

    <section
        id="menuScreen"
        class="screen menu-screen">


        <!-- ============================================
             LOGO
        ============================================= -->

        <div
            id="logoContainer"
            class="logo-container">

            <img
                id="logo"
                src="hyakkiyako.png"
                alt="Hyakkiyako">

        </div>



        <!-- ============================================
             VIEW BUTTON
        ============================================= -->

        <button
            id="viewButton"
            class="view-button">

            <span>VIEW</span>

        </button>


    </section>



    <!-- ================================================
         LEADERBOARD SCREEN
    ================================================= -->

    <section
        id="leaderboardScreen"
        class="screen leaderboard-screen">


        <div class="leaderboard-window">


            <!-- HEADER -->

            <div class="leaderboard-header">

                <div class="header-line"></div>

                <h1>
                    HYAKKIYAKO CLUB
                </h1>

                <p>
                    5TH CLUB LEADERBOARD
                </p>

                <div class="header-line"></div>

            </div>



            <!-- ========================================
                 WIP PLACEHOLDER
            ========================================= -->

            <div class="wip-area">

                <div class="wip-symbol">
                    ◈
                </div>


                <h2>
                    LEADERBOARD
                </h2>


                <div class="wip-text">
                    WIP
                </div>


                <p>
                    LEADERBOARD DATA
                    WILL BE INSERTED HERE
                </p>

            </div>



            <!-- BACK BUTTON -->

            <button
                id="backButton"
                class="back-button">

                BACK

            </button>


        </div>


    </section>



    <!-- ================================================
         JAVASCRIPT
    ================================================= -->

    <script src="script.js"></script>


</body>

</html>
