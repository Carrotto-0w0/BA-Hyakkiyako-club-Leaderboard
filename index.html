<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hyakkiyako Club</title>

    <!-- Discord / Social Preview -->
    <meta property="og:title" content="Hyakkiyako Club">
    <meta
        property="og:description"
        content="Hyakkiyako 5th Club Leaderboard"
    >
    <meta
        property="og:image"
        content="https://carrotto-0w0.github.io/BA-Hyakkiyako-club-Leaderboard/Hyakkiyako_Intro.png"
    >
    <meta
        property="og:url"
        content="https://carrotto-0w0.github.io/BA-Hyakkiyako-club-Leaderboard/"
    >
    <meta property="og:type" content="website">

    <link rel="stylesheet" href="./style.css">
</head>

<body>

<!-- =====================================================
     MENU SCREEN
===================================================== -->

<section
    id="menuScreen"
    class="screen menu-screen active"
>

    <!-- Background -->
    <div
        id="menuBackground"
        class="menu-background"
    ></div>

    <!-- Sakura particles -->
    <canvas id="particleCanvas"></canvas>

    <!-- Main content -->
    <div class="menu-content">

        <div
            id="logoContainer"
            class="logo-container"
        >
            <img
                id="mainLogo"
                src="./hyakkiyako.png"
                alt="Hyakkiyako"
                class="main-logo"
                draggable="false"
            >
        </div>

        <div class="menu-buttons">

            <button
                id="leaderboardButton"
                class="menu-button"
            >
                <span class="menu-button-main">
                    CLUB LEADERBOARD
                </span>

                <span class="menu-button-sub">
                    5TH CLUB RANKING
                </span>

                <span class="button-line"></span>
            </button>

            <button
                id="patButton"
                class="menu-button"
            >
                <span class="menu-button-main">
                    PAT IZUNA
                </span>

                <span class="menu-button-sub">
                    PETTING AREA
                </span>

                <span class="button-line"></span>
            </button>

        </div>

        <!-- Day / Night -->
        <button
            id="modeToggle"
            class="mode-toggle"
            aria-label="Toggle day and night mode"
        >
            <span id="modeIcon">☀</span>
            <span id="modeText">DAY</span>
        </button>

    </div>

</section>


<!-- =====================================================
     LEADERBOARD SCREEN
===================================================== -->

<section
    id="leaderboardScreen"
    class="screen secondary-screen leaderboard-screen"
>

    <div class="screen-topbar">

        <button
            id="leaderboardBackButton"
            class="back-button"
        >
            BACK
        </button>

        <div class="screen-title-group">

            <div class="screen-title">
                HYAKKIYAKO CLUB
            </div>

            <div class="screen-subtitle">
                5TH CLUB LEADERBOARD
            </div>

        </div>

    </div>


    <!-- Season selector -->

    <div class="season-selector">

        <button
            class="season-option"
            data-season="kaiten"
        >
            <span class="season-code">
                TA85
            </span>

            <span class="season-name">
                KAITEN
            </span>
        </button>


        <button
            class="season-option active"
            data-season="kurokage"
        >
            <span class="season-code">
                GA33
            </span>

            <span class="season-name">
                KUROKAGE
            </span>
        </button>

    </div>


    <!-- Leaderboard -->

    <main
        id="leaderboardList"
        class="leaderboard-list"
    >
        <!-- Generated by JavaScript -->
    </main>

</section>


<!-- =====================================================
     PAT IZUNA SCREEN
===================================================== -->

<section
    id="izunaScreen"
    class="screen secondary-screen izuna-screen"
>

    <div class="screen-topbar">

        <button
            id="izunaBackButton"
            class="back-button"
        >
            BACK
        </button>

        <div class="screen-title-group">

            <div class="screen-title">
                PAT IZUNA
            </div>

            <div class="screen-subtitle">
                HYAKKIYAKO PETTING AREA
            </div>

        </div>

    </div>


    <div class="izuna-content">

        <div class="pet-score">

            You have pet Izuna for

            <span id="petSeconds">
                0.0
            </span>

            second

        </div>


        <div
            id="izunaArea"
            class="izuna-area"
        >

            <div class="pet-ring ring-1"></div>
            <div class="pet-ring ring-2"></div>

            <div class="pet-glow"></div>

            <img
                id="izunaStatic"
                class="izuna-image"
                src="./izuna-static.png"
                alt="Izuna"
                draggable="false"
            >

            <img
                id="izunaPet"
                class="izuna-image izuna-pet"
                src="./izuna-pet.png"
                alt="Izuna"
                draggable="false"
            >

        </div>


        <div
            id="petInstruction"
            class="pet-instruction"
        >
            RUB IZUNA'S HEAD
        </div>

        <div class="pet-subinstruction">
            MOVE WHILE HOLDING / DRAGGING
        </div>

    </div>

</section>


<script src="./script.js"></script>

</body>
</html>
