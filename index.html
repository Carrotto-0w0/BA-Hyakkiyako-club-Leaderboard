<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hyakkiyako Club</title>


    <!-- =====================================================
         DISCORD / SOCIAL EMBED
    ====================================================== -->

    <meta
        property="og:title"
        content="Hyakkiyako Club"
    >

    <meta
        property="og:description"
        content="Hyakkiyako Club 5th Club Leaderboard"
    >

    <meta
        property="og:type"
        content="website"
    >

    <meta
        property="og:url"
        content="https://carrotto-0w0.github.io/BA-Hyakkiyako-club-Leaderboard/"
    >

    <meta
        property="og:image"
        content="https://carrotto-0w0.github.io/BA-Hyakkiyako-club-Leaderboard/Hyakkiyako_Intro.png"
    >

    <meta
        property="og:image:width"
        content="1280"
    >

    <meta
        property="og:image:height"
        content="720"
    >


    <!-- TWITTER / OTHER SOCIAL PREVIEW -->

    <meta
        name="twitter:card"
        content="summary_large_image"
    >

    <meta
        name="twitter:title"
        content="Hyakkiyako Club"
    >

    <meta
        name="twitter:description"
        content="Hyakkiyako Club 5th Club Leaderboard"
    >

    <meta
        name="twitter:image"
        content="https://carrotto-0w0.github.io/BA-Hyakkiyako-club-Leaderboard/Hyakkiyako_Intro.png"
    >


    <!-- =====================================================
         CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>


    <!-- =====================================================
         MENU SCREEN
    ====================================================== -->

    <section
        id="menuScreen"
        class="screen menu-screen"
    >

        <canvas
            id="particleCanvas"
        ></canvas>


        <!-- LOGO -->

        <div
            id="logoContainer"
            class="logo-container"
        >

            <img
                id="logo"
                class="hyakkiyako-logo"
                src="./hyakkiyako.png"
                alt="Hyakkiyako Club"
                draggable="false"
            >

        </div>


        <!-- VIEW BUTTON -->

        <button
            id="viewButton"
            class="view-button"
            type="button"
        >

            <span>VIEW</span>

            <div class="button-line"></div>

        </button>

    </section>



    <!-- =====================================================
         LEADERBOARD SCREEN
    ====================================================== -->

    <section
        id="leaderboardScreen"
        class="screen leaderboard-screen"
    >

        <div
            class="leaderboard-container"
        >


            <!-- HEADER -->

            <div
                class="leaderboard-header"
            >

                <div
                    class="leaderboard-title"
                >

                    HYAKKIYAKO CLUB

                </div>


                <div
                    class="leaderboard-subtitle"
                >

                    5TH CLUB LEADERBOARD

                </div>

            </div>



            <!-- =================================================
                 BIG PLACEHOLDER
            ================================================== -->

            <div
                id="leaderboardPlaceholder"
                class="leaderboard-placeholder"
            >


                <!-- Corner decorations -->

                <div
                    class="corner corner-tl"
                ></div>

                <div
                    class="corner corner-tr"
                ></div>

                <div
                    class="corner corner-bl"
                ></div>

                <div
                    class="corner corner-br"
                ></div>


                <!-- Placeholder content -->

                <div
                    class="placeholder-title"
                >

                    CLUB RANKING

                </div>


                <div
                    class="placeholder-main"
                >

                    LEADERBOARD

                </div>


                <div
                    class="placeholder-text"
                >

                    WIP

                </div>


                <div
                    class="placeholder-description"
                >

                    MEMBER RANKING WILL APPEAR HERE

                </div>

            </div>



            <!-- =================================================
                 IZUNA PET GAME
            ================================================== -->

            <div
                id="izunaGame"
                class="izuna-game"
            >


                <!-- SCORE -->

                <div
                    id="petScore"
                    class="pet-score"
                >

                    You have pet Izuna for

                    <span
                        id="petSeconds"
                    >0.0</span>

                    second

                </div>



                <!-- IZUNA -->

                <div
                    id="izunaContainer"
                    class="izuna-container"
                >

                    <div
                        id="petGlow"
                        class="pet-glow"
                    ></div>


                    <img
                        id="izunaStatic"
                        class="izuna-image izuna-static"
                        src="./izuna-static.png"
                        alt="Izuna"
                        draggable="false"
                    >


                    <img
                        id="izunaPet"
                        class="izuna-image izuna-pet"
                        src="./izuna-pet.png"
                        alt="Izuna"
                        draggable="false"
                    >

                </div>


                <!-- INSTRUCTION -->

                <div
                    id="petInstruction"
                    class="pet-instruction"
                >

                    RUB IZUNA'S HEAD

                </div>

            </div>

        </div>



        <!-- BACK -->

        <button
            id="backButton"
            class="back-button"
            type="button"
        >

            BACK

        </button>

    </section>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script
        src="./script.js"
    ></script>

</body>

</html>
