<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hyakkiyako Club</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================================
         PARTICLE CANVAS
    ====================================================== -->

    <canvas id="particleCanvas"></canvas>


    <!-- =====================================================
         MAIN MENU
    ====================================================== -->

    <main id="menuScreen" class="menu-screen">


        <!-- LOGO -->

        <div
            id="logoContainer"
            class="logo-container"
        >

            <img
                id="logo"
                src="hyakkiyako.png"
                alt="Hyakkiyako"
            >

        </div>


        <!-- VIEW BUTTON -->

        <button
            id="viewButton"
            class="view-button"
        >

            VIEW

        </button>


    </main>



    <!-- =====================================================
         LEADERBOARD SCREEN
    ====================================================== -->

    <section
        id="leaderboardScreen"
        class="leaderboard-screen"
    >


        <div class="leaderboard-container">


            <!-- TITLE -->

            <div class="leaderboard-title">

                HYAKKIYAKO CLUB

            </div>


            <div class="leaderboard-subtitle">

                5TH CLUB LEADERBOARD

            </div>


            <!-- WIP PLACEHOLDER -->

            <div class="leaderboard-placeholder">


                <div class="placeholder-icon">

                    ✦

                </div>


                <div class="placeholder-title">

                    LEADERBOARD

                </div>


                <div class="placeholder-text">

                    WIP

                </div>


                <div class="placeholder-description">

                    MEMBER RANKING DATA<br>
                    WILL BE ADDED HERE

                </div>


            </div>


        </div>


        <!-- BACK BUTTON -->

        <button
            id="backButton"
            class="back-button"
        >

            BACK

        </button>


    </section>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="script.js"></script>


</body>

</html>
