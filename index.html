<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hyakkiyako Club</title>


    <!-- =====================================================
         DISCORD / OPEN GRAPH
         ===================================================== -->

    <meta
        property="og:title"
        content="Hyakkiyako Club"
    >

    <meta
        property="og:description"
        content="Hyakkiyako Club 5th Club Leaderboard"
    >

    <meta
        property="og:type"
        content="website"
    >

    <meta
        property="og:url"
        content="https://carrotto-0w0.github.io/BA-Hyakkiyako-club-Leaderboard/"
    >

    <meta
        property="og:image"
        content="https://carrotto-0w0.github.io/BA-Hyakkiyako-club-Leaderboard/Hyakkiyako_Intro.png"
    >

    <meta
        property="og:image:type"
        content="image/png"
    >

    <meta
        property="og:image:width"
        content="800"
    >

    <meta
        property="og:image:height"
        content="1000"
    >

    <meta
        name="twitter:card"
        content="summary"
    >

    <meta
        name="twitter:title"
        content="Hyakkiyako Club"
    >

    <meta
        name="twitter:description"
        content="Hyakkiyako Club 5th Club Leaderboard"
    >

    <meta
        name="twitter:image"
        content="https://carrotto-0w0.github.io/BA-Hyakkiyako-club-Leaderboard/Hyakkiyako_Intro.png"
    >


    <!-- CSS -->
    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>


<!-- =========================================================
     GLOBAL PARTICLE CANVAS
     ========================================================= -->

<canvas id="particleCanvas"></canvas>



<!-- =========================================================
     MENU SCREEN
     ========================================================= -->

<section
    id="menuScreen"
    class="screen menu-screen"
>


    <!-- Background -->
    <div
        id="menuBackground"
        class="menu-background"
    ></div>


    <!-- Background overlay -->
    <div class="background-overlay"></div>


    <!-- Sakura atmosphere -->
    <div class="sakura-haze"></div>


    <!-- Logo -->
    <div
        id="logoContainer"
        class="logo-container"
    >

        <img
            id="logo"
            class="main-logo"
            src="./hyakkiyako.png"
            alt="Hyakkiyako"
            draggable="false"
        >

    </div>


    <!-- Menu -->
    <div class="main-menu">


        <button
            id="leaderboardButton"
            class="menu-button"
            type="button"
        >

            <span class="menu-button-jp">
                百鬼夜行
            </span>

            <span class="menu-button-title">
                CLUB LEADERBOARD
            </span>

            <span class="menu-button-arrow">
                →
            </span>

        </button>



        <button
            id="petButton"
            class="menu-button"
            type="button"
        >

            <span class="menu-button-jp">
                イズナ
            </span>

            <span class="menu-button-title">
                PAT IZUNA
            </span>

            <span class="menu-button-arrow">
                →
            </span>

        </button>


    </div>


    <!-- Day / Night -->
    <div class="mode-switcher">


        <button
            id="dayModeButton"
            class="mode-button"
            type="button"
        >
            ☀ DAY
        </button>


        <div class="mode-divider"></div>


        <button
            id="nightModeButton"
            class="mode-button active"
            type="button"
        >
            ☾ NIGHT
        </button>


    </div>


</section>




<!-- =========================================================
     LEADERBOARD SCREEN
     ========================================================= -->

<section
    id="leaderboardScreen"
    class="screen secondary-screen"
>


    <div class="secondary-background"></div>

    <div class="secondary-overlay"></div>


    <div class="secondary-container">


        <!-- Header -->

        <div class="secondary-header">

            <div class="section-kicker">
                HYAKKIYAKO CLUB
            </div>

            <div class="section-title">
                5TH CLUB LEADERBOARD
            </div>

            <div class="section-line"></div>

        </div>



        <!-- Boss selector -->

        <div class="boss-selector">


            <button
                id="kaitenButton"
                class="boss-button active"
                type="button"
            >

                <span class="boss-small">
                    BOSS SEASON
                </span>

                <span class="boss-name">
                    KAITEN
                </span>

            </button>



            <button
                id="kurokageButton"
                class="boss-button"
                type="button"
            >

                <span class="boss-small">
                    BOSS SEASON
                </span>

                <span class="boss-name">
                    KUROKAGE
                </span>

            </button>


        </div>



        <!-- Score panel -->

        <div
            id="bossPanel"
            class="boss-panel"
        >


            <div class="panel-decoration panel-tl"></div>
            <div class="panel-decoration panel-tr"></div>
            <div class="panel-decoration panel-bl"></div>
            <div class="panel-decoration panel-br"></div>


            <div
                id="bossPanelTitle"
                class="boss-panel-title"
            >
                KAITEN
            </div>


            <div class="boss-panel-subtitle">
                BOSS SCORE RANKING
            </div>


            <div class="boss-panel-line"></div>


            <div class="boss-panel-wip">
                WIP
            </div>


            <div
                id="bossPanelDescription"
                class="boss-panel-description"
            >
                KAITEN MEMBER SCORE WILL APPEAR HERE
            </div>


        </div>



        <!-- Back -->

        <button
            id="leaderboardBackButton"
            class="back-button"
            type="button"
        >
            BACK
        </button>


    </div>

</section>




<!-- =========================================================
     PAT IZUNA SCREEN
     ========================================================= -->

<section
    id="petScreen"
    class="screen secondary-screen pet-screen"
>


    <div class="secondary-background"></div>

    <div class="secondary-overlay"></div>


    <div class="secondary-container pet-container">


        <!-- Header -->

        <div class="secondary-header">

            <div class="section-kicker">
                HYAKKIYAKO CLUB
            </div>

            <div class="section-title">
                PAT IZUNA
            </div>

            <div class="section-line"></div>

        </div>



        <!-- Score -->

        <div class="pet-score">

            You have pet Izuna for

            <span id="petSeconds">
                0.0
            </span>

            second

        </div>



        <!-- Izuna -->

        <div
            id="izunaArea"
            class="izuna-area"
        >


            <img
                id="izunaStatic"
                class="izuna-image"
                src="./izuna-static.png"
                alt="Izuna"
                draggable="false"
            >


            <img
                id="izunaPet"
                class="izuna-image izuna-pet"
                src="./izuna-pet.png"
                alt="Izuna"
                draggable="false"
            >


            <div class="pet-glow"></div>


        </div>



        <div
            id="petInstruction"
            class="pet-instruction"
        >
            RUB IZUNA'S HEAD
        </div>



        <!-- Back -->

        <button
            id="petBackButton"
            class="back-button"
            type="button"
        >
            BACK
        </button>


    </div>

</section>



<script src="./script.js"></script>

</body>

</html>
