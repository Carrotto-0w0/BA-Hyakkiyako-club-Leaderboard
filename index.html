<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hyakkiyako Club</title>


    <!-- =====================================================
         DISCORD / SOCIAL PREVIEW
    ====================================================== -->

    <meta
        property="og:title"
        content="Hyakkiyako Club"
    >

    <meta
        property="og:description"
        content="Hyakkiyako Club 5th Club Leaderboard"
    >

    <meta
        property="og:type"
        content="website"
    >

    <meta
        property="og:image"
        content="https://carrotto-0w0.github.io/BA-Hyakkiyako-club-Leaderboard/Hyakkiyako_Intro.png"
    >

    <meta
        property="og:image:width"
        content="1280"
    >

    <meta
        property="og:image:height"
        content="720"
    >

    <meta
        property="og:url"
        content="https://carrotto-0w0.github.io/BA-Hyakkiyako-club-Leaderboard/"
    >


    <!-- =====================================================
         TWITTER / DISCORD LARGE PREVIEW
    ====================================================== -->

    <meta
        name="twitter:card"
        content="summary_large_image"
    >

    <meta
        name="twitter:title"
        content="Hyakkiyako Club"
    >

    <meta
        name="twitter:description"
        content="Hyakkiyako Club 5th Club Leaderboard"
    >

    <meta
        name="twitter:image"
        content="https://carrotto-0w0.github.io/BA-Hyakkiyako-club-Leaderboard/Hyakkiyako_Intro.png"
    >


    <!-- =====================================================
         CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>


    <!-- =====================================================
         MAIN MENU
    ====================================================== -->

    <section
        id="menuScreen"
        class="screen menu-screen"
    >

        <!-- Background particle canvas -->

        <canvas
            id="particleCanvas"
        ></canvas>


        <!-- Hyakkiyako Logo -->

        <div
            id="logoContainer"
            class="logo-container"
        >

            <img
                id="hyakkiyakoLogo"
                class="hyakkiyako-logo"
                src="./hyakkiyako.png"
                alt="Hyakkiyako Club"
            >

        </div>


        <!-- VIEW BUTTON -->

        <button
            id="viewButton"
            class="view-button"
        >
            VIEW
        </button>

    </section>



    <!-- =====================================================
         LEADERBOARD SCREEN
    ====================================================== -->

    <section
        id="leaderboardScreen"
        class="screen leaderboard-screen"
    >


        <!-- =================================================
             HEADER
        ================================================== -->

        <div class="leaderboard-header">

            <div class="club-title">
                HYAKKIYAKO CLUB
            </div>

            <div class="club-subtitle">
                5TH CLUB LEADERBOARD
            </div>

        </div>



        <!-- =================================================
             LEADERBOARD PLACEHOLDER
        ================================================== -->

        <div
            id="leaderboardPlaceholder"
            class="leaderboard-placeholder"
        >

            <div class="ranking-title">
                CLUB RANKING
            </div>

            <div class="ranking-main">
                LEADERBOARD
            </div>

            <div class="wip-text">
                WIP
            </div>

            <div class="ranking-description">
                MEMBER RANKING WILL APPEAR HERE
            </div>

        </div>



        <!-- =================================================
             IZUNA PET GAME
        ================================================== -->

        <div
            id="izunaGame"
            class="izuna-game"
        >


            <!-- Score -->

            <div
                id="petScore"
                class="pet-score"
            >
                You have pet Izuna for
                <span id="petSeconds">0.0</span>
                second
            </div>


            <!-- Izuna -->

            <div
                id="izunaContainer"
                class="izuna-container"
            >

                <img
                    id="izunaStatic"
                    class="izuna-image izuna-static"
                    src="./izuna-static.png"
                    alt="Izuna"
                >

                <img
                    id="izunaPet"
                    class="izuna-image izuna-pet"
                    src="./izuna-pet.png"
                    alt="Izuna"
                >

                <div
                    id="petGlow"
                    class="pet-glow"
                ></div>

            </div>


            <!-- Instruction -->

            <div
                class="pet-instruction"
            >
                RUB IZUNA'S HEAD
            </div>

        </div>



        <!-- =================================================
             BACK BUTTON
        ================================================== -->

        <button
            id="backButton"
            class="back-button"
        >
            BACK
        </button>


    </section>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script
        src="./script.js"
    ></script>


</body>

</html>
