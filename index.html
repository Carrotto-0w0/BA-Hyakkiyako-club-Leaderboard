<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hyakkiyako Club</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>


    <!-- ==============================
         MENU
    =============================== -->

    <section
        id="menuScreen"
        class="screen menu-screen"
    >

        <canvas id="particleCanvas"></canvas>


        <div
            id="logoContainer"
            class="logo-container"
        >

            <img
                src="./hyakkiyako.png"
                class="main-logo"
                alt="Hyakkiyako"
            >

        </div>


        <button
            id="viewButton"
            class="view-button"
        >

            <span>VIEW</span>

            <div class="button-line"></div>

        </button>

    </section>



    <!-- ==============================
         LEADERBOARD
    =============================== -->

    <section
        id="leaderboardScreen"
        class="screen leaderboard-screen"
    >

        <div class="leaderboard-container">


            <!-- HEADER -->

            <div class="leaderboard-header">

                <div class="leaderboard-title">
                    HYAKKIYAKO CLUB
                </div>

                <div class="leaderboard-subtitle">
                    5TH CLUB LEADERBOARD
                </div>

            </div>



            <!-- ==========================
                 PLACEHOLDER
            =========================== -->

            <div class="leaderboard-placeholder">


                <div class="corner corner-tl"></div>
                <div class="corner corner-tr"></div>
                <div class="corner corner-bl"></div>
                <div class="corner corner-br"></div>


                <div class="placeholder-label">
                    CLUB RANKING
                </div>


                <div class="placeholder-main">
                    LEADERBOARD
                </div>


                <div class="placeholder-line"></div>


                <div class="placeholder-wip">
                    WIP
                </div>


                <div class="placeholder-description">
                    MEMBER RANKING WILL APPEAR HERE
                </div>

            </div>



            <!-- ==========================
                 IZUNA MINI GAME
            =========================== -->

            <div
                id="izunaGame"
                class="izuna-game"
            >


                <div class="pet-score">

                    You have pet Izuna for

                    <span id="petSeconds">
                        0.0
                    </span>

                    second

                </div>


                <div
                    id="izunaArea"
                    class="izuna-area"
                >

                    <img
                        id="izunaStatic"
                        class="izuna-image"
                        src="./izuna-static.png"
                        alt="Izuna"
                        draggable="false"
                    >


                    <img
                        id="izunaPet"
                        class="izuna-image izuna-pet"
                        src="./izuna-pet.png"
                        alt="Izuna"
                        draggable="false"
                    >


                    <div class="pet-glow"></div>

                </div>


                <div
                    id="petInstruction"
                    class="pet-instruction"
                >
                    RUB IZUNA'S HEAD
                </div>

            </div>

        </div>


        <!-- BACK -->

        <button
            id="backButton"
            class="back-button"
        >
            BACK
        </button>

    </section>



    <script src="./script.js"></script>

</body>

</html>
