<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hyakkiyako Club</title>

    <!-- =========================================================
         DISCORD / OPEN GRAPH
         ========================================================= -->

    <meta
        property="og:title"
        content="Hyakkiyako Club"
    >

    <meta
        property="og:description"
        content="Hyakkiyako Club 5th Club Leaderboard"
    >

    <meta
        property="og:type"
        content="website"
    >

    <meta
        property="og:url"
        content="https://carrotto-0w0.github.io/BA-Hyakkiyako-club-Leaderboard/"
    >

    <meta
        property="og:image"
        content="https://carrotto-0w0.github.io/BA-Hyakkiyako-club-Leaderboard/Hyakkiyako_Intro.png?v=014"
    >

    <meta
        property="og:image:type"
        content="image/png"
    >

    <!--
        เปลี่ยนเป็นขนาดของ Preview ที่ต้องการให้ Discord
        ประมวลผลเป็นภาพขนาดเล็ก
    -->
    <meta
        property="og:image:width"
        content="800"
    >

    <meta
        property="og:image:height"
        content="1000"
    >

    <!-- Twitter / Discord compatibility -->
    <meta
        name="twitter:card"
        content="summary"
    >

    <meta
        name="twitter:title"
        content="Hyakkiyako Club"
    >

    <meta
        name="twitter:description"
        content="Hyakkiyako Club 5th Club Leaderboard"
    >

    <meta
        name="twitter:image"
        content="https://carrotto-0w0.github.io/BA-Hyakkiyako-club-Leaderboard/Hyakkiyako_Intro.png?v=014"
    >

    <!-- =========================================================
         CSS
         ========================================================= -->

    <link
        rel="stylesheet"
        href="./style.css"
    >
</head>


<body>

    <!-- =========================================================
         MAIN MENU
         ========================================================= -->

    <section
        id="menuScreen"
        class="screen menu-screen"
    >

        <!-- Particle canvas -->
        <canvas id="particleCanvas"></canvas>


        <!-- Logo -->
        <div
            id="logoContainer"
            class="logo-container"
        >

            <!--
                เพิ่ม id="logo"
                เพื่อให้ script.js รุ่นเดิมสามารถหา Logo ได้
            -->
            <img
                id="logo"
                src="./hyakkiyako.png"
                alt="Hyakkiyako"
                class="main-logo"
                draggable="false"
            >

        </div>


        <!-- VIEW button -->
        <button
            id="viewButton"
            class="view-button"
            type="button"
        >

            <span>VIEW</span>

            <div class="button-line"></div>

        </button>

    </section>



    <!-- =========================================================
         LEADERBOARD SCREEN
         ========================================================= -->

    <section
        id="leaderboardScreen"
        class="screen leaderboard-screen"
    >

        <div class="leaderboard-container">


            <!-- =================================================
                 HEADER
                 ================================================= -->

            <div class="leaderboard-header">

                <div class="leaderboard-title">
                    HYAKKIYAKO CLUB
                </div>

                <div class="leaderboard-subtitle">
                    5TH CLUB LEADERBOARD
                </div>

            </div>



            <!-- =================================================
                 LEADERBOARD PLACEHOLDER
                 ================================================= -->

            <div class="leaderboard-placeholder">

                <!-- Corners -->
                <div
                    class="corner corner-tl"
                ></div>

                <div
                    class="corner corner-tr"
                ></div>

                <div
                    class="corner corner-bl"
                ></div>

                <div
                    class="corner corner-br"
                ></div>


                <!-- Label -->
                <div class="placeholder-label">
                    CLUB RANKING
                </div>


                <!-- Main title -->
                <div class="placeholder-main">
                    LEADERBOARD
                </div>


                <!-- Divider -->
                <div class="placeholder-line"></div>


                <!-- WIP -->
                <div class="placeholder-wip">
                    WIP
                </div>


                <!-- Description -->
                <div class="placeholder-description">
                    MEMBER RANKING WILL APPEAR HERE
                </div>

            </div>



            <!-- =================================================
                 IZUNA PET GAME
                 ================================================= -->

            <div
                id="izunaGame"
                class="izuna-game"
            >


                <!-- Score -->
                <div class="pet-score">

                    You have pet Izuna for

                    <span id="petSeconds">
                        0.0
                    </span>

                    second

                </div>



                <!-- Izuna area -->
                <div
                    id="izunaArea"
                    class="izuna-area"
                >


                    <!-- Static Izuna -->
                    <img
                        id="izunaStatic"
                        class="izuna-image"
                        src="./izuna-static.png"
                        alt="Izuna"
                        draggable="false"
                    >


                    <!-- Petting Izuna -->
                    <img
                        id="izunaPet"
                        class="izuna-image izuna-pet"
                        src="./izuna-pet.png"
                        alt="Izuna"
                        draggable="false"
                    >


                    <!-- Glow -->
                    <div class="pet-glow"></div>

                </div>



                <!-- Instruction -->
                <div
                    id="petInstruction"
                    class="pet-instruction"
                >
                    RUB IZUNA'S HEAD
                </div>

            </div>

        </div>



        <!-- =====================================================
             BACK BUTTON
             ===================================================== -->

        <button
            id="backButton"
            class="back-button"
            type="button"
        >
            BACK
        </button>

    </section>



    <!-- =========================================================
         JAVASCRIPT
         ========================================================= -->

    <script src="./script.js"></script>

</body>

</html>
