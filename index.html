<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hyakkiyako Club</title>


    <!-- =====================================================
         DISCORD EMBED
    ====================================================== -->

    <meta
        property="og:title"
        content="Hyakkiyako Club"
    >

    <meta
        property="og:description"
        content="Hyakkiyako Club 5th Club Leaderboard"
    >

    <meta
        property="og:type"
        content="website"
    >

    <meta
        property="og:image"
        content="https://carrotto_0w0.github.io/Peroro_5th_Club_Leaderboard/Hyakkiyako_Intro.webp"
    >

    <meta
        property="og:image:width"
        content="1280"
    >

    <meta
        property="og:image:height"
        content="720"
    >

    <meta
        property="og:url"
        content="https://carrotto_0w0.github.io/Peroro_5th_Club_Leaderboard/"
    >


    <!-- =====================================================
         TWITTER / SOCIAL PREVIEW
    ====================================================== -->

    <meta
        name="twitter:card"
        content="summary_large_image"
    >

    <meta
        name="twitter:title"
        content="Hyakkiyako Club"
    >

    <meta
        name="twitter:description"
        content="Hyakkiyako Club 5th Club Leaderboard"
    >

    <meta
        name="twitter:image"
        content="https://carrotto_0w0.github.io/Peroro_5th_Club_Leaderboard/Hyakkiyako_Intro.webp"
    >


    <!-- =====================================================
         CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>


    <!-- =====================================================
         MENU
    ====================================================== -->

    <section
        id="menuScreen"
        class="screen menu-screen"
    >


        <!-- PARTICLE CANVAS -->

        <canvas
            id="particleCanvas"
        ></canvas>


        <!-- LOGO -->

        <div
            id="logoContainer"
            class="logo-container"
        >

            <img
                src="./hyakkiyako.png"
                class="main-logo"
                alt="Hyakkiyako"
            >

        </div>


        <!-- VIEW BUTTON -->

        <button
            id="viewButton"
            class="view-button"
        >

            <span>
                VIEW
            </span>

            <div
                class="button-line"
            ></div>

        </button>


    </section>



    <!-- =====================================================
         LEADERBOARD SCREEN
    ====================================================== -->

    <section
        id="leaderboardScreen"
        class="screen leaderboard-screen"
    >


        <div
            class="leaderboard-container"
        >


            <!-- =================================================
                 HEADER
            ================================================== -->

            <div
                class="leaderboard-header"
            >

                <div
                    class="leaderboard-title"
                >
                    HYAKKIYAKO CLUB
                </div>


                <div
                    class="leaderboard-subtitle"
                >
                    5TH CLUB LEADERBOARD
                </div>

            </div>



            <!-- =================================================
                 LEADERBOARD PLACEHOLDER
            ================================================== -->

            <div
                class="leaderboard-placeholder"
            >


                <!-- CORNERS -->

                <div
                    class="corner corner-tl"
                ></div>

                <div
                    class="corner corner-tr"
                ></div>

                <div
                    class="corner corner-bl"
                ></div>

                <div
                    class="corner corner-br"
                ></div>


                <!-- LABEL -->

                <div
                    class="placeholder-label"
                >
                    CLUB RANKING
                </div>


                <!-- MAIN TITLE -->

                <div
                    class="placeholder-main"
                >
                    LEADERBOARD
                </div>


                <!-- LINE -->

                <div
                    class="placeholder-line"
                ></div>


                <!-- WIP -->

                <div
                    class="placeholder-wip"
                >
                    WIP
                </div>


                <!-- DESCRIPTION -->

                <div
                    class="placeholder-description"
                >
                    MEMBER RANKING WILL APPEAR HERE
                </div>


            </div>



            <!-- =================================================
                 IZUNA MINI GAME
            ================================================== -->

            <div
                id="izunaGame"
                class="izuna-game"
            >


                <!-- SCORE -->

                <div
                    class="pet-score"
                >

                    You have pet Izuna for

                    <span
                        id="petSeconds"
                    >
                        0.0
                    </span>

                    second

                </div>



                <!-- IZUNA AREA -->

                <div
                    id="izunaArea"
                    class="izuna-area"
                >


                    <!-- STATIC IZUNA -->

                    <img
                        id="izunaStatic"
                        class="izuna-image"
                        src="./izuna-static.png"
                        alt="Izuna"
                        draggable="false"
                    >


                    <!-- PETTING IZUNA -->

                    <img
                        id="izunaPet"
                        class="izuna-image izuna-pet"
                        src="./izuna-pet.png"
                        alt="Izuna"
                        draggable="false"
                    >


                    <!-- GLOW -->

                    <div
                        class="pet-glow"
                    ></div>


                </div>



                <!-- PET INSTRUCTION -->

                <div
                    id="petInstruction"
                    class="pet-instruction"
                >
                    RUB IZUNA'S HEAD
                </div>


            </div>


        </div>



        <!-- =================================================
             BACK BUTTON
        ================================================== -->

        <button
            id="backButton"
            class="back-button"
        >
            BACK
        </button>


    </section>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script
        src="./script.js"
    ></script>


</body>

</html>
