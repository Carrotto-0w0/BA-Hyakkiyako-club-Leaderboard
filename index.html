<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hyakkiyako</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================================
         MENU SCREEN
    ====================================================== -->

    <section id="menuScreen" class="screen menu-screen">

        <!-- Background / transition particles -->
        <canvas id="particleCanvas"></canvas>

        <!-- Logo -->
        <div id="logoContainer" class="logo-container">

            <img
                src="hyakkiyako.png"
                alt="Hyakkiyako"
                class="main-logo"
            >

        </div>


        <!-- VIEW BUTTON -->
        <button
            id="viewButton"
            class="view-button"
        >

            <span>VIEW</span>

            <div class="button-line"></div>

        </button>

    </section>



    <!-- =====================================================
         LEADERBOARD SCREEN
    ====================================================== -->

    <section
        id="leaderboardScreen"
        class="screen leaderboard-screen"
    >

        <div class="leaderboard-container">


            <!-- TITLE -->

            <div class="leaderboard-title">
                HYAKKIYAKO CLUB
            </div>

            <div class="leaderboard-subtitle">
                5TH CLUB LEADERBOARD
            </div>



            <!-- LEADERBOARD PLACEHOLDER -->

            <div class="leaderboard-placeholder">

                <div class="wip-title">
                    LEADERBOARD
                </div>

                <div class="wip-text">
                    WIP
                </div>

                <div class="wip-description">
                    MEMBER RANKING WILL APPEAR HERE
                </div>

            </div>



            <!-- =================================================
                 IZUNA PET GAME
            ================================================== -->

            <div
                id="izunaGame"
                class="izuna-game"
            >


                <!-- SCORE -->

                <div class="pet-score">

                    You have pet Izuna for

                    <span id="petSeconds">
                        0.0
                    </span>

                    second

                </div>



                <!-- IZUNA -->

                <div
                    id="izunaArea"
                    class="izuna-area"
                >


                    <!-- STATIC IMAGE -->

                    <img
                        id="izunaStatic"
                        class="izuna-image"
                        src="izuna-static.png"
                        alt="Izuna"
                        draggable="false"
                    >


                    <!-- PET IMAGE -->

                    <img
                        id="izunaPet"
                        class="izuna-image izuna-pet"
                        src="izuna-pet.png"
                        alt="Izuna"
                        draggable="false"
                    >


                    <!-- GLOW -->

                    <div class="pet-glow"></div>


                    <!-- HEAD AREA -->

                    <div
                        id="headZone"
                        class="head-zone"
                    ></div>


                </div>



                <!-- INSTRUCTION -->

                <div
                    id="petInstruction"
                    class="pet-instruction"
                >

                    RUB IZUNA'S HEAD

                </div>

            </div>

        </div>



        <!-- BACK -->

        <button
            id="backButton"
            class="back-button"
        >

            BACK

        </button>

    </section>



    <!-- SCRIPT -->

    <script src="script.js"></script>

</body>

</html>
